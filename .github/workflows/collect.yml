name: ブドウ相場の収集

on:
  schedule:
    # 毎日 10:00 JST（= 01:00 UTC）。日報は前営業日分が朝までに掲載されます。
    - cron: "0 1 * * *"
  workflow_dispatch:      # 手動実行用（Actions タブの Run workflow）
    inputs:
      days_back:
        description: "さかのぼる日数（初回のまとめ取りは 70 など）"
        required: false
        default: "12"

permissions:
  contents: write         # データの追記コミット用
  pages: write            # GitHub Pages 公開用
  id-token: write

concurrency:
  group: budou-shijou
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 日報から収集してサイトを生成
        env:
          DAYS_BACK: ${{ inputs.days_back || '12' }}
        run: python collect.py

      - name: 更新をコミット
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raw_history.csv budou_prices.csv site
          if git diff --staged --quiet; then
            echo "更新なし"
          else
            git commit -m "相場データ更新 $(TZ=Asia/Tokyo date +%Y-%m-%d)"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
